name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, mnestic]
    env:
      PATH: /home/alan/.nvm/versions/node/v24.13.0/bin:/home/alan/.local/bin:/home/alan/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Pull latest
        working-directory: /home/alan/Code/mnestic
        # Self-hosted runner reuses the same working tree; a dirty tree blocks
        # rebase pulls. Hard-reset to origin/main so deploy always runs from a
        # clean, known state.
        run: |
          git fetch origin
          git reset --hard origin/main
      - name: Deploy
        working-directory: /home/alan/Code/mnestic
        run: bash scripts/deploy.sh
