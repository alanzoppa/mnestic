services:
  mnestic-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mnestic-backend:latest
    container_name: mnestic-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./chroma_data:/data/chroma_data
      - ${NOTES_DIR:-./notes}:/data/notes:ro
      - ${IMAGES_DIR:-./images}:/data/images:ro
      - ${DATA_DIR:-./data}:/data/data:ro
      - ./logs:/data/logs
      - ./.env:/app/.env:ro
    environment:
      - MNESTIC_DATA_DIR=/data
      - ENV_FILE=/app/.env
      - LOG_DIR=/data/logs
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - STATE_DIR=/data/chroma_data
      - UVICORN_HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - mnestic

  mnestic-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        API_REWRITE_TARGET: http://mnestic-backend:8000/api/:path*
    image: mnestic-frontend:latest
    container_name: mnestic-frontend
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - API_REWRITE_TARGET=http://mnestic-backend:8000/api/:path*
    depends_on:
      mnestic-backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - mnestic

networks:
  mnestic:
    driver: bridge